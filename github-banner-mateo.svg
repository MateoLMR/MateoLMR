<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">Mateo — Full Stack Developer</title>
  <desc id="desc">Banner de perfil de GitHub estilo terminal con paleta Tokyo Night: nombre, rol, slogan, stack técnico y una ventana de consola.</desc>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#292e42"></circle>
    </pattern>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7aa2f7"></stop>
      <stop offset="0.5" stop-color="#bb9af7"></stop>
      <stop offset="1" stop-color="#e0af68"></stop>
    </linearGradient>
  </defs>

  <!-- Fondo -->
  <rect width="1200" height="300" fill="#1a1b26"></rect>
  <rect width="1200" height="300" fill="url(#dots)"></rect>
  <rect y="296" width="1200" height="4" fill="url(#accent)"></rect>

  <g font-family="'JetBrains Mono','Fira Code','Cascadia Code',Consolas,'Courier New',monospace">
    <!-- Bloque izquierdo: identidad -->
    <text x="60" y="74" font-size="13" letter-spacing="2" fill="#9aa5ce">// SOFTWARE ENGINEER · WEB FULL STACK</text>
    <text x="60" y="132" font-size="46" font-weight="700" fill="#c0caf5">Hola, soy <tspan fill="#e0af68">Mateo</tspan><tspan fill="#e0af68">_<animate attributeName="opacity" values="1;0;1" dur="1.1s" calcMode="discrete" repeatCount="indefinite"></animate></tspan></text>
    <text x="60" y="172" font-size="19" fill="#c0caf5">Software Engineering Student</text>
    <text x="60" y="204" font-size="15" fill="#7dcfff">&gt; Construyo software que resuelve problemas reales.</text>

    <!-- Chips de stack: azul = frontend, morado = backend/BD, verde = testing -->
    <g font-size="13" text-anchor="middle">
      <rect x="60" y="228" width="79" height="28" rx="14" fill="#7aa2f7" fill-opacity="0.1" stroke="#7aa2f7" stroke-opacity="0.5"></rect>
      <text x="99.5" y="247" fill="#7aa2f7">Angular</text>
      <rect x="147" y="228" width="86" height="28" rx="14" fill="#7aa2f7" fill-opacity="0.1" stroke="#7aa2f7" stroke-opacity="0.5"></rect>
      <text x="190" y="247" fill="#7aa2f7">Tailwind</text>
      <rect x="241" y="228" width="79" height="28" rx="14" fill="#bb9af7" fill-opacity="0.1" stroke="#bb9af7" stroke-opacity="0.5"></rect>
      <text x="280.5" y="247" fill="#bb9af7">Node.js</text>
      <rect x="328" y="228" width="79" height="28" rx="14" fill="#bb9af7" fill-opacity="0.1" stroke="#bb9af7" stroke-opacity="0.5"></rect>
      <text x="367.5" y="247" fill="#bb9af7">Express</text>
      <rect x="415" y="228" width="55" height="28" rx="14" fill="#bb9af7" fill-opacity="0.1" stroke="#bb9af7" stroke-opacity="0.5"></rect>
      <text x="442.5" y="247" fill="#bb9af7">Java</text>
      <rect x="478" y="228" width="63" height="28" rx="14" fill="#bb9af7" fill-opacity="0.1" stroke="#bb9af7" stroke-opacity="0.5"></rect>
      <text x="509.5" y="247" fill="#bb9af7">MySQL</text>
      <rect x="549" y="228" width="141" height="28" rx="14" fill="#9ece6a" fill-opacity="0.1" stroke="#9ece6a" stroke-opacity="0.5"></rect>
      <text x="619.5" y="247" fill="#9ece6a">Robot Framework</text>
    </g>

    <!-- Bloque derecho: ventana de terminal -->
    <rect x="750" y="40" width="390" height="220" rx="12" fill="#16161e" stroke="#2f334d"></rect>
    <path d="M762 40 H1128 A12 12 0 0 1 1140 52 V72 H750 V52 A12 12 0 0 1 762 40 Z" fill="#1f2335"></path>
    <circle cx="772" cy="56" r="5" fill="#f7768e"></circle>
    <circle cx="790" cy="56" r="5" fill="#e0af68"></circle>
    <circle cx="808" cy="56" r="5" fill="#9ece6a"></circle>
    <text x="945" y="60" font-size="12" text-anchor="middle" fill="#9aa5ce">~/mateo — zsh</text>

    <g font-size="13">
      <text x="772" y="100" fill="#c0caf5"><tspan fill="#9ece6a">$</tspan> whoami</text>
      <text x="772" y="124" fill="#a9b1d6">web full stack · QA enthusiast</text>
      <text x="772" y="152" fill="#c0caf5"><tspan fill="#9ece6a">$</tspan> npm run test:api</text>
      <text x="772" y="176" fill="#9ece6a">✓ endpoints validated with Postman</text>
      <text x="772" y="204" fill="#c0caf5"><tspan fill="#9ece6a">$</tspan> git push origin main</text>
      <text x="772" y="228" fill="#e0af68">→ shipping solutions to real problems</text>
    </g>
  </g>
</svg>
